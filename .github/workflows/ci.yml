name: CI

on:
  pull_request:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test-darwin-arm64:
    name: Test macOS arm64 (Node ${{ matrix.node-version }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "24"]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Zig
        uses: mlugg/setup-zig@v2

      - name: Check Zig formatting
        run: zig fmt --check build.zig src tests

      - name: Test
        run: zig build test -Doptimize=ReleaseFast -j1

      - name: Build
        run: zig build -Doptimize=ReleaseFast -j1

      - name: Package npm artifacts
        run: ./scripts/package-npm.sh

      - name: Verify npm wrapper
        run: |
          node npm/utoo-lint/bin/utoo-lint.js --no-config test/fixtures/bad.ts
          set +e
          node npm/utoo-lint/bin/utoo-lint.js --config=npm/utoo-lint/configs/frontend.json test/fixtures/bad.ts
          status=$?
          set -e
          test "$status" -eq 1

      - name: Test npm package
        run: pnpm --dir npm/utoo-lint test
