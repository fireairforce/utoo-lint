name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to publish, for example v0.1.0. Leave empty to build only."
        required: false
        type: string
      publish_npm:
        description: "Publish packages to npm"
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-release-assets:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'v')
    name: Build ${{ matrix.asset }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - asset: utoo-lint-darwin-arm64
            target: aarch64-macos
            binary: utoo-lint
            archive: tar.gz
            package_path: npm/@utoo/lint-darwin-arm64
          - asset: utoo-lint-darwin-x64
            target: x86_64-macos
            binary: utoo-lint
            archive: tar.gz
            package_path: npm/@utoo/lint-darwin-x64
          - asset: utoo-lint-linux-arm64
            target: aarch64-linux-gnu
            binary: utoo-lint
            archive: tar.gz
            package_path: npm/@utoo/lint-linux-arm64
          - asset: utoo-lint-linux-x64
            target: x86_64-linux-gnu
            binary: utoo-lint
            archive: tar.gz
            package_path: npm/@utoo/lint-linux-x64
          - asset: utoo-lint-windows-x64
            target: x86_64-windows-gnu
            binary: utoo-lint.exe
            archive: zip
            package_path: npm/@utoo/lint-win32-x64
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup Zig
        uses: mlugg/setup-zig@v2

      - name: Build
        run: |
          zig build -Dtarget=${{ matrix.target }} -Doptimize=ReleaseFast -j1 --prefix zig-out/${{ matrix.asset }}
          mkdir -p dist/${{ matrix.asset }}
          cp zig-out/${{ matrix.asset }}/bin/${{ matrix.binary }} dist/${{ matrix.asset }}/${{ matrix.binary }}

      - name: Package archive
        run: |
          if [ "${{ matrix.archive }}" = "zip" ]; then
            (cd dist/${{ matrix.asset }} && zip -9 ../${{ matrix.asset }}.zip ${{ matrix.binary }})
            shasum -a 256 dist/${{ matrix.asset }}.zip > dist/${{ matrix.asset }}.zip.sha256
          else
            tar -C dist/${{ matrix.asset }} -czf dist/${{ matrix.asset }}.tar.gz ${{ matrix.binary }}
            shasum -a 256 dist/${{ matrix.asset }}.tar.gz > dist/${{ matrix.asset }}.tar.gz.sha256
          fi

      - name: Stage native npm package
        run: |
          mkdir -p dist/native/${{ matrix.package_path }}/bin
          cp ${{ matrix.package_path }}/package.json dist/native/${{ matrix.package_path }}/package.json
          cp dist/${{ matrix.asset }}/${{ matrix.binary }} dist/native/${{ matrix.package_path }}/bin/${{ matrix.binary }}
          chmod 755 dist/native/${{ matrix.package_path }}/bin/${{ matrix.binary }}

      - name: Upload release artifact
        uses: actions/upload-artifact@v6
        with:
          name: release-${{ matrix.asset }}
          path: |
            dist/${{ matrix.asset }}.*
          if-no-files-found: error

      - name: Upload native npm package
        uses: actions/upload-artifact@v6
        with:
          name: native-${{ matrix.asset }}
          path: dist/native
          if-no-files-found: error

  publish-github-release:
    name: Publish GitHub Release assets
    needs: build-release-assets
    if: (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'v')) || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-latest
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v7
        with:
          pattern: release-*
          path: dist/release-assets
          merge-multiple: true

      - name: Publish GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 || gh release create "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --generate-notes
          gh release upload "${RELEASE_TAG}" dist/release-assets/* --clobber --repo "${GITHUB_REPOSITORY}"

  publish-npm:
    name: Publish npm packages
    needs: build-release-assets
    if: (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'v')) || (github.event_name == 'workflow_dispatch' && inputs.publish_npm && inputs.release_tag != '')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install package manager dependencies
        run: pnpm install --frozen-lockfile

      - name: Download native npm packages
        uses: actions/download-artifact@v7
        with:
          pattern: native-*
          path: dist/native-packages
          merge-multiple: true

      - name: Resolve release version
        id: release_version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          set -euo pipefail

          VERSION="${RELEASE_TAG#v}"
          if [ -z "${VERSION}" ] || [ "${VERSION}" = "${RELEASE_TAG}" ]; then
            echo "Release tag must start with v, got: ${RELEASE_TAG}" >&2
            exit 1
          fi

          NPM_TAG="latest"
          if [[ "${VERSION}" == *"-"* ]]; then
            PRERELEASE="${VERSION#*-}"
            NPM_TAG="${PRERELEASE%%.*}"
          fi

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "npm_tag=${NPM_TAG}" >> "${GITHUB_OUTPUT}"

      - name: Update npm package versions
        env:
          VERSION: ${{ steps.release_version.outputs.version }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");

          const version = process.env.VERSION;
          const nativeRoot = "npm/@utoo";
          const nativePackagePaths = fs
            .readdirSync(nativeRoot)
            .filter((name) => name.startsWith("lint-"))
            .map((name) => path.join(nativeRoot, name, "package.json"));
          const packagePaths = ["npm/utoo-lint/package.json", ...nativePackagePaths];

          for (const packagePath of packagePaths) {
            const pkg = JSON.parse(fs.readFileSync(packagePath, "utf8"));
            pkg.version = version;
            if (pkg.name === "@utoo/lint") {
              for (const name of Object.keys(pkg.optionalDependencies)) {
                pkg.optionalDependencies[name] = version;
              }
            }
            fs.writeFileSync(packagePath, `${JSON.stringify(pkg, null, 2)}\n`);
          }
          NODE

      - name: Stage native binaries into workspace packages
        run: |
          for package_dir in dist/native-packages/npm/@utoo/lint-*; do
            package_name="$(basename "${package_dir}")"
            mkdir -p "npm/@utoo/${package_name}/bin"
            cp -R "${package_dir}/bin/." "npm/@utoo/${package_name}/bin/"
          done

      - name: Verify package contents
        run: |
          for package_dir in npm/@utoo/lint-* npm/utoo-lint; do
            pnpm --dir "${package_dir}" pack --dry-run
          done

      - name: Publish npm packages
        env:
          NPM_TAG: ${{ steps.release_version.outputs.npm_tag }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for package_dir in npm/@utoo/lint-*; do
            pnpm publish "${package_dir}" --access public --provenance --tag "${NPM_TAG}" --no-git-checks
          done
          pnpm publish npm/utoo-lint --access public --provenance --tag "${NPM_TAG}" --no-git-checks
